<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三角洲行动娱乐抽取器</title>
<!-- 引入html2canvas用于截图 -->
<script src="html2canvas.min.js"></script>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    /* ======================
    后台修改这里设置背景：
    background-image: url("./1.jpg");
    background‑size: cover;
    background‑position: center;
    背景透明度修改下面伪元素 opacity，0~1之间
    不需要背景就把 background-image 注释掉
    ====================== */
    background-color: #ffffff;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 15px;
    overflow-x:hidden;
    position: relative;
}
/* 背景遮罩层，用来实现背景图片透明度，不要删除 */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image: url("2.png"); /*在这里填入图片地址*/
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity:1; /* 修改这个数值调整背景透明度 0完全透明 1不透明 */
}
/* ========== 波普斜向渐变放大标题：左→右字体越来越大 ========== */
h1{
    margin-bottom: 24px;
    text-align: center;
    transform: rotate(-6deg);
    display: inline-flex;
    gap: 2px;
    flex-wrap: nowrap;
}
h1 span{
    display: inline-block;
    font-weight: 900;
    color: #fff;
    text-shadow:
        3px 3px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
}
/* 每个字从左到右越来越大 */
h1 span:nth-child(1){ font-size:22px; color:#ff2255; }
h1 span:nth-child(2){ font-size:24px; color:#2244ff; }
h1 span:nth-child(3){ font-size:26px; color:#00bb44; }
h1 span:nth-child(4){ font-size:28px; color:#ff4400; }
h1 span:nth-child(5){ font-size:30px; color:#aa22ff; }
h1 span:nth-child(6){ font-size:32px; color:#ff2255; }
h1 span:nth-child(7){ font-size:34px; color:#2244ff; }
h1 span:nth-child(8){ font-size:36px; color:#00bb44; }
h1 span:nth-child(9){ font-size:38px; color:#ff4400; }
h1 span:nth-child(10){ font-size:40px; color:#aa22ff; }
h1 span:nth-child(11){ font-size:42px; color:#ff2255; }
h1 span:nth-child(12){ font-size:44px; color:#2244ff; }
h1 span:nth-child(13){ font-size:46px; color:#00bb44; }
h1 span:nth-child(14){ font-size:48px; color:#ff4400; }
/* ========== 漫画波普通用按钮：粗黑描边，高饱和，卡通风格 ========== */
.diff-btn{
    padding: 10px 18px;
    border: 3px solid #000;
    background: #2288ff;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: transform 0.15s ease;
    box-shadow: 4px 4px 0 #000;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.diff-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 #000;
}
.diff-btn:active{
    transform: translate(2px,2px);
    box-shadow: 2px 2px 0 #000;
}
.diff-btn.active{
    background: #ff2266;
    color: #fff;
}
.diff-btn.fate.active{
    background: #aa33ff;
    color: #fff;
}
/* ========== 重置按钮 波普 ========== */
.reset-btn{
    padding: 11px 22px;
    border:3px solid #000;
    background: #ff3355;
    color:#fff;
    border-radius:4px;
    cursor: pointer;
    font-weight:bold;
    font-size:14px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing:1px;
}
.reset-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
.reset-btn:active{
    transform: translate(2px,2px);
    box-shadow:2px 2px 0 #000;
}
/* 一键抽取按钮 */
.auto-spin-btn{
    padding: 11px 22px;
    border:3px solid #000;
    background:#6ca984;
    color:#000;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing:1px;
}
.auto-spin-btn:hover:not(:disabled){
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
.auto-spin-btn:active:not(:disabled){
    transform: translate(2px,2px);
    box-shadow:2px 2px 0 #000;
}
.auto-spin-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}
/* ========== 主抽取大按钮 波普漫画 ========== */
#spinBtn{
    padding: 18px 70px;
    font-size: 22px;
    font-weight: 900;
    background: #00dd77;
    color:#000;
    border: 4px solid #000;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
}
#spinBtn:hover{
    transform: translate(-3px,-3px);
    box-shadow:9px 9px 0 #000;
}
#spinBtn:active{
    transform: translate(3px,3px);
    box-shadow:3px 3px 0 #000;
}
#spinBtn:disabled{
    background:#999;
    color:#444;
    cursor: not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}
/* ========== 复制截图按钮波普 ========== */
#copyImageBtn{
    margin-top:14px;
    padding:11px 24px;
    border:3px solid #000;
    background:#ffcc00;
    color:#000;
    font-weight:bold;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
}
#copyImageBtn:hover:not(:disabled){
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
#copyImageBtn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}
#copyTip{
    margin-top:8px;
    font-size:14px;
    color:#fff;
    min-height:20px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
}
/* ========== 配置面板波普漫画风：粗黑边框，明亮底色，漫画阴影 ========== */
.config-panel{
    width: 680px;
    max-width: 100%;
    background: rgba(255,255,255,0.65);
    border:4px solid #000;
    box-shadow: 8px 8px 0 #000;
    border-radius:14px;
    padding: 20px;
    margin-bottom: 24px;
}
.config-section{
    margin-bottom: 18px;
}
.config-section:last-child{
    margin-bottom: 0;
}
.config-title{
    color:#ff2255;
    font-size:16px;
    font-weight:900;
    margin-bottom:12px;
    display: flex;
    align-items: center;
    gap:6px;
}
.check-group{
    display: flex;
    flex-wrap: wrap;
    gap:12px 18px;
}
.check-item{
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-size:14px;
    color:#222;
    user-select: none;
    font-weight:bold;
}
.check-item input{
    cursor: pointer;
    width:18px;height:18px;
}
.check-item:hover{
    color:#2266ff;
}
.map-sublist{
    margin-top: 8px;
    padding-left: 10px;
    border-left:3px solid #000;
    display: none;
}
.map-sublist.show{
    display: block;
}
.control-box{
    display:flex;
    gap:14px;
    margin:20px 0;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center; /* 大小按钮垂直居中对齐 */
}
/* ========== 开箱滚动区 波普漫画改造 ========== */
.case-wrap{
    position: relative;
    width: 720px; /* 🔹加宽，原640px */
    max-width: 100%;
    margin:30px 0;
}
.case-container{
    width:100%;
    height:150px; /* 🔹加高，原130px */
    background-color:rgba(255,255,255,0.60); /*🔹背景半透明白，0‑1，数值越小越透明；文字不受影响 */
    border:4px solid #000;
    border-radius:14px; /*🔹大圆角 */
    overflow:hidden; /*🔹必须！防止内部内容溢出圆角 */
    position:relative;
    box-shadow: 6px 6px 0 #000;
}
.case-track{
    height:100%;
    display:flex;
    align-items:center;
    will-change: transform;
}
.case-item{
    flex-shrink:0;
    width:134px;
    height:96px;
    margin:0 6px;
    background:#00bbff;
    border:3px solid #000;
    border-radius:10px; /*🔹每个物品格子圆角 */
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:13px;
    font-weight:900;
    color:#000;
    padding:0 6px;
    line-height:1.3;
    word-break:break-all;
    box-shadow:3px 3px 0 #000;
}
.case-item .sub{
    font-size:11px;
    color:#222;
    font-weight:bold;
    margin-top:3px;
}
.case-item:nth-child(even){
    background:#ffdd22;
}
/* 中间瞄准指示器波普漫画 */
.case-indicator{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    transform: translateX(-50%);
    width:6px;
    background:#ff2266;
    box-shadow:0 0 0 2px #000;
    z-index:10;
    pointer-events:none;
}
.case-indicator::before,
.case-indicator::after{
    content: '';
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    border-left:12px solid transparent;
    border-right:12px solid transparent;
}
.case-indicator::before{
    top:-4px;
    border-top:18px solid #ff2266;
    filter: drop-shadow(0 2px 0 #000);
}
.case-indicator::after{
    bottom:-4px;
    border-bottom:18px solid #ff2266;
    filter: drop-shadow(0 2px 0 #000);
}
.result{
    margin-top:10px;
    font-size:26px;
    color:#ff4477;
    font-weight:900;
    min-height:34px;
    text-align:center;
    text-shadow:2px 2px 0 #000;
}
.record{
    margin-top:22px;
    padding:28px 24px;
    border:4px solid #000;
    border-radius:14px;  /* 加大圆角 */
    width:640px;
    max-width:100%;
    background:rgba(255,255,255,0.65);  /* 改成半透明 */
    box-shadow:8px 8px 0 #000;
}
.record h3{
    color:#2244ff;
    font-size:23px;
    margin-bottom:16px;
    font-weight:900;
}
.record p{
    font-size:19px;
    color:#111;
    line-height:2.5;
    font-weight:bold;
}
.tips{
    margin-top:16px;
    color:#ffffff;
    font-size:14px;
    text-align:center;
    max-width:640px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
}
@media(max-width:650px){
    .case-container{height:110px;}
    .case-item{
        width:108px;
        height:80px;
        font-size:12px;
    }
    h1 span{
        font-size: clamp(16px,3vw,36px);
    }
    .config-panel{padding:16px;}
    #spinBtn{padding:15px 40px;font-size:18px;}
    .record{padding:20px 16px;}
    .record h3{font-size:20px;}
    .record p{font-size:16px;line-height:2.2;}
    .result{font-size:21px;}
}
</style>
</head>
<body>
<h1>
<span>三</span><span>角</span><span>洲</span><span>行</span><span>动</span><span>全</span><span>能</span><span>抽</span><span>取</span><span>器</span>
</h1>
<!-- 配置面板 -->
<div class="config-panel">
    <div class="config-section">
        <div class="config-title">📦 抽取内容（勾选参与抽取的项目）</div>

    <div class="config-section">

            <button class="diff-btn" data-armor="easy">初级(1~3级)</button>
            <button class="diff-btn" data-armor="mid">中级(3~4级)</button>
            <button class="diff-btn" data-armor="hard">高级(3~5级)</button>
            <button class="diff-btn fate active" data-armor="fate">🎲 命运(交给命运)</button>
        </div>
    </div>
    <div class="config-section" id="mapConfigSection" style="display:none;">
        <div class="config-title">🗺️ 地图池（勾选参与抽取的地图）</div>
        <div class="check-group">
            <label class="check-item"><input type="checkbox" class="map-check" value="零号大坝" checked> 零号大坝</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="长弓溪谷" checked> 长弓溪谷</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="巴克什" checked> 巴克什</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="航天基地" checked> 航天基地</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="潮汐监狱" checked> 潮汐监狱</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="AZ3核电站" checked> AZ3核电站</label>
        </div>
        <div class="config-title" style="margin-top:10px; font-size:13px;">地图难度模式</div>
        <div class="diff-group">
            <button class="diff-btn active" data-mapdiff="secret">机密模式</button>
            <button class="diff-btn" data-mapdiff="top">绝密模式</button>
            <button class="diff-btn fate" data-mapdiff="mapfate">🎲命运(交给命运)</button>
        </div>
    </div>
</div>
<!-- 开箱滚动区 -->
<div class="case-wrap">
    <div class="case-container">
        <div class="case-track" id="caseTrack"></div>
    </div>
    <div class="case-indicator"></div>
</div>
<!-- ✅三个按钮放在开箱滚动区的下面！顺序：重置｜大抽取｜一键抽取 -->
<div class="control-box">
    <button class="reset-btn" id="resetBtn">重置重来</button>
    <button id="spinBtn">开始抽取</button>
    <button class="auto-spin-btn" id="autoSpinBtn">自动抽取全部</button>
</div>
<div class="result" id="resText"></div>
<div class="record" id="recordWrap">
    <h3>📋 本局抽取结果</h3>
    <p id="recordText">暂无抽取结果</p>
</div>
<!-- 新增截图复制按钮 -->
<button id="copyImageBtn" disabled>生成结果图片并复制到剪贴板</button>
<div id="copyTip"></div>
<div class="tips"></div>

// ✅自动生成权重字典（旧逻辑兼容，不需要手动维护ALL_ITEM_WEIGHTS）
const ALL_ITEM_WEIGHTS = {};
const weaponList = [];
const extraWeaponList = [];
const operatorList = [];

// =========自动构建基础数组（只维护上面ITEM_POOL，这里不用动）=========
for(const name in ITEM_POOL){
    const meta = ITEM_POOL[name];
    ALL_ITEM_WEIGHTS[name] = meta.weight;
    if(meta.type === "weapon"){
        // 判断是否属于扩展武器
        const isExtra = ["SR-25射手步枪","巴雷特","AWM狙击枪"].includes(name);
        const obj = {name, category: meta.category};
        if(isExtra){
            extraWeaponList.push(obj);
        }else{
            weaponList.push(obj);
        }
    }
    if(meta.type === "operator"){
        operatorList.push({name, sub: meta.sub});
    }
}

// 【删除原来静态 helmetPool / armorPool，改为动态获取函数】
function getFilteredHelmetPool(mode){
    const pool = [];
    for(const name in ITEM_POOL){
        const item = ITEM_POOL[name];
        if(item.type !== "helmet") continue;
        const lv = item.level;
        let ok = false;
        if(mode === "easy"){
            if(["1","2","3","egg"].includes(lv)) ok = true;
        }else if(mode === "mid"){
            if(["3","4","egg"].includes(lv)) ok = true;
        }else if(mode === "hard"){
            if(["3","4","5","egg"].includes(lv)) ok = true;
        }else if(mode === "fate"){
            ok = true;
        }
        if(ok) pool.push(name);
    }
    return pool;
}
function getFilteredArmorPool(mode){
    const pool = [];
    for(const name in ITEM_POOL){
        const item = ITEM_POOL[name];
        if(item.type !== "armor") continue;
        const lv = item.level;
        let ok = false;
        if(mode === "easy"){
            if(["1","2","3","egg"].includes(lv)) ok = true;
        }else if(mode === "mid"){
            if(["3","4","egg"].includes(lv)) ok = true;
        }else if(mode === "hard"){
            if(["3","4","5","egg"].includes(lv)) ok = true;
        }else if(mode === "fate"){
            ok = true;
        }
        if(ok) pool.push(name);
    }
    return pool;
}

function shuffleArray(arr) {
    const newArr = [...arr];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}
function weightedRandom(pool, lastItemKey){
    const weights = pool.map((item) => {
        let w = ALL_ITEM_WEIGHTS[item.text] ?? 1;
        if(lastResult[lastItemKey] === item.text){
            w *= DRAW_CONFIG.repeatPenalty;
        }
        return w;
    });
    const totalWeight = weights.reduce((sum, w) => sum + w, 0);
    let random = Math.random() * totalWeight;
    for(let i = 0; i < weights.length; i++){
        random -= weights[i];
        if(random <= 0){
            return i;
        }
    }
    return pool.length - 1;
}

            queue.push({key:'weapon1', label:'武器①', isDualFirst:true});
            queue.push({key:'weapon2', label:'武器②', isDualSecond:true});
        }else{

        }
    }
    if(document.getElementById('chk-helmet').checked) queue.push({key:'helmet', label:'头盔'});
    if(document.getElementById('chk-armor').checked) queue.push({key:'armor', label:'护甲'});
    if(document.getElementById('chk-operator').checked) queue.push({key:'operator', label:'干员'});
    if(document.getElementById('chk-map').checked) queue.push({key:'map', label:'地图'});
    return queue;

function getCurrentPool(){
    const current = spinQueue[spinIndex];
    if(!current) return [];
    switch(current.key){
        case 'weapon':
        case 'weapon1':
        case 'weapon2': {
            let wList = [...weaponList];
            if(document.getElementById('chk-weapon-extra').checked){
                wList = wList.concat(extraWeaponList);
            }
            wList = wList.filter(w=> selectedWeaponCats.includes(w.category));
            if(current.isDualSecond && dualGunExcludeCat){
                wList = wList.filter(w=> w.category !== dualGunExcludeCat);
            }
            return wList.map(w => ({text: w.name, sub: '', category: w.category}));
        }
        case 'helmet':{
            const names = getFilteredHelmetPool(armorMode);
            return names.map(name => ({text: name, sub: ''}));
        }
        case 'armor':{
            const names = getFilteredArmorPool(armorMode);
            return names.map(name => ({text: name, sub: ''}));
        }
        case 'operator':
            return operatorList.map(op => ({text: op.name, sub: op.sub}));
        case 'map':{
            const checkedMapNames = [];
            document.querySelectorAll('.map-check:checked').forEach(cb=>{
                checkedMapNames.push(cb.value);
            });
            const mapPool = [];
            if(mapDiffMode === "mapfate"){
                for(const m of mapSourcePool.secret){
                    if(checkedMapNames.includes(m)) mapPool.push({text: `${m}-机密`, sub:""});
                }
                for(const m of mapSourcePool.top){
                    if(checkedMapNames.includes(m)) mapPool.push({text: `${m}-绝密`, sub:""});
                }
            }else{
                for(const m of mapSourcePool[mapDiffMode]){
                    if(checkedMapNames.includes(m)) mapPool.push({text: m, sub: mapDiffText[mapDiffMode] + '模式'});
                }
            }
            return mapPool;
        }
    }
    return [];
}
