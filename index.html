<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三角洲行动娱乐抽取器</title>
<script src="html2canvas.min.js"></script>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background-color: #ffffff;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px;
    overflow-x:hidden;
    position: relative;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image: url("2.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity:1;
}
h1{
    margin-bottom: 18px;
    text-align: center;
    transform: rotate(-6deg);
    display: inline-flex;
    gap: 2px;
    flex-wrap: nowrap;
}
h1 span{
    display: inline-block;
    font-weight: 900;
    color: #fff;
    text-shadow:
        3px 3px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
}
h1 span:nth-child(1){ font-size:20px; color:#ff2255; }
h1 span:nth-child(2){ font-size:22px; color:#2244ff; }
h1 span:nth-child(3){ font-size:24px; color:#00bb44; }
h1 span:nth-child(4){ font-size:26px; color:#ff4400; }
h1 span:nth-child(5){ font-size:28px; color:#aa22ff; }
h1 span:nth-child(6){ font-size:30px; color:#ff2255; }
h1 span:nth-child(7){ font-size:32px; color:#2244ff; }
h1 span:nth-child(8){ font-size:34px; color:#00bb44; }
h1 span:nth-child(9){ font-size:36px; color:#ff4400; }
h1 span:nth-child(10){ font-size:38px; color:#aa22ff; }
h1 span:nth-child(11){ font-size:40px; color:#ff2255; }
h1 span:nth-child(12){ font-size:42px; color:#2244ff; }
h1 span:nth-child(13){ font-size:44px; color:#00bb44; }
h1 span:nth-child(14){ font-size:46px; color:#ff4400; }

.diff-btn{
    padding: 8px 14px;
    border: 3px solid #000;
    background: #2288ff;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    transition: transform 0.15s ease;
    box-shadow: 4px 4px 0 #000;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.diff-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 #000;
}
.diff-btn:active{
    transform: translate(2px,2px);
    box-shadow: 2px 2px 0 #000;
}
.diff-btn.active{
    background: #ff2266;
    color: #fff;
}
.diff-btn.fate.active{
    background: #aa33ff;
    color: #fff;
}

.reset-btn{
    padding: 10px 18px;
    border:3px solid #000;
    background: #ff3355;
    color:#fff;
    border-radius:4px;
    cursor: pointer;
    font-weight:bold;
    font-size:13px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing:1px;
}
.reset-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
.reset-btn:active{
    transform: translate(2px,2px);
    box-shadow:2px 2px 0 #000;
}

.auto-spin-btn{
    padding: 10px 18px;
    border:3px solid #000;
    background:#6ca984;
    color:#000;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing:1px;
}
.auto-spin-btn:hover:not(:disabled){
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
.auto-spin-btn:active:not(:disabled){
    transform: translate(2px,2px);
    box-shadow:2px 2px 0 #000;
}
.auto-spin-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}

#spinBtn{
    padding: 16px 54px;
    font-size: 20px;
    font-weight: 900;
    background: #00dd77;
    color:#000;
    border: 4px solid #000;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
}
#spinBtn:hover{
    transform: translate(-3px,-3px);
    box-shadow:9px 9px 0 #000;
}
#spinBtn:active{
    transform: translate(3px,3px);
    box-shadow:3px 3px 0 #000;
}
#spinBtn:disabled{
    background:#999;
    color:#444;
    cursor: not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}

#copyImageBtn{
    margin-top:14px;
    padding:11px 24px;
    border:3px solid #000;
    background:#ffcc00;
    color:#000;
    font-weight:bold;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
}
#copyImageBtn:hover:not(:disabled){
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
#copyImageBtn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}
#copyTip{
    margin-top:8px;
    font-size:14px;
    color:#fff;
    min-height:20px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
}

.config-panel{
    width: 680px;
    max-width: 100%;
    background: rgba(255,255,255,0.65);
    border:4px solid #000;
    box-shadow: 8px 8px 0 #000;
    border-radius:14px;
    padding: 18px;
    margin-bottom: 20px;
}
.config-section{
    margin-bottom: 16px;
}
.config-section:last-child{
    margin-bottom: 0;
}
.config-title{
    color:#ff2255;
    font-size:15px;
    font-weight:900;
    margin-bottom:10px;
    display: flex;
    align-items: center;
    gap:6px;
}
.check-group{
    display: flex;
    flex-wrap: wrap;
    gap:12px 18px;
}
.check-item{
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-size:14px;
    color:#222;
    user-select: none;
    font-weight:bold;
}
.check-item input{
    cursor: pointer;
    width:18px;height:18px;
}
.check-item:hover{
    color:#2266ff;
}
.map-sublist{
    margin-top: 8px;
    padding-left: 10px;
    border-left:3px solid #000;
    display: none;
}
.map-sublist.show{
    display: block;
}
.control-box{
    display:flex;
    gap:14px;
    margin:18px 0;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
}

.case-wrap{
    position: relative;
    width: 720px;
    max-width: 100%;
    margin:24px 0;
}
.case-container{
    width:100%;
    height:150px;
    background-color:rgba(255,255,255,0.60);
    border:4px solid #000;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow: 6px 6px 0 #000;
}
.case-track{
    height:100%;
    display:flex;
    align-items:center;
    will-change: transform;
}
.case-item{
    flex-shrink:0;
    width:134px;
    height:96px;
    margin:0 6px;
    background:#00bbff;
    border:3px solid #000;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:13px;
    font-weight:900;
    color:#000;
    padding:0 6px;
    line-height:1.3;
    word-break:break-all;
    box-shadow:3px 3px 0 #000;
}
.case-item .sub{
    font-size:11px;
    color:#222;
    font-weight:bold;
    margin-top:3px;
}
.case-item:nth-child(even){
    background:#ffdd22;
}
.case-indicator{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    transform: translateX(-50%);
    width:6px;
    background:#ff2266;
    box-shadow:0 0 0 2px #000;
    z-index:10;
    pointer-events:none;
}
.case-indicator::before,
.case-indicator::after{
    content: '';
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    border-left:12px solid transparent;
    border-right:12px solid transparent;
}
.case-indicator::before{
    top:-4px;
    border-top:18px solid #ff2266;
    filter: drop-shadow(0 2px 0 #000);
}
.case-indicator::after{
    bottom:-4px;
    border-bottom:18px solid #ff2266;
    filter: drop-shadow(0 2px 0 #000);
}

.flip-wrap{
    width: 520px;
    max-width: 100%;
    margin: 18px auto;
    display:none;
    position:relative;
}
.flip-wrap.active{
    display:block;
}
.flip-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}
.card-item{
    aspect-ratio: 4 / 5;
    border:4px solid #000;
    border-radius:12px;
    box-shadow:5px 5px 0 #000;
    cursor:pointer;
    position:relative;
    transform-style: preserve-3d;
    transition: transform 0.25s ease;
    will-change: transform;
}
.card-item:hover{
    transform: translateY(-4px);
}
.card-item.disabled{
    cursor:not-allowed;
}
.card-item.disabled:hover{
    transform: none;
}
.card-item.flipped{
    transform: rotateY(180deg);
    cursor: default;
}
.card-item.flipped:hover{
    transform: rotateY(180deg);
}
.card-item.selected-result{
    box-shadow:0 0 0 4px #ffdd00, 6px 6px 0 #000;
}
.card-face{
    position:absolute;
    inset:0;
    border-radius:8px;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    font-weight:bold;
    font-size:14px;
    text-align:center;
    overflow:hidden;
}
.card-back{
    background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25), transparent 40%),
        linear-gradient(160deg, #2288ff, #1155cc);
    color:#fff;
    font-size:26px;
    border:2px solid #000;
}
.card-front{
    background:
        linear-gradient(160deg, #ffffff, #f7f7f7);
    color:#111;
    transform: rotateY(180deg);
    border:2px solid #000;
}
.card-front .card-title{
    font-size:16px;
    font-weight:900;
    color:#ff2255;
    margin-bottom:6px;
}
.card-front .card-sub{
    font-size:13px;
    color:#333;
    line-height:1.4;
}

.result{
    margin-top:10px;
    font-size:24px;
    color:#ff4477;
    font-weight:900;
    min-height:34px;
    text-align:center;
    text-shadow:2px 2px 0 #000;
}
.step-hint{
    font-size:17px;
    font-weight:bold;
    color:#ffffff;
    text-align:center;
    margin:6px 0;
    text-shadow:2px 2px 0 #000;
    min-height:24px;
}
.record{
    margin-top:22px;
    padding:28px 24px;
    border:4px solid #000;
    border-radius:14px;
    width:640px;
    max-width:100%;
    background:rgba(255,255,255,0.65);
    box-shadow:8px 8px 0 #000;
}
.record h3{
    color:#2244ff;
    font-size:23px;
    margin-bottom:16px;
    font-weight:900;
}
.record p{
    font-size:19px;
    color:#111;
    line-height:2.5;
    font-weight:bold;
}
.tips{
    margin-top:16px;
    color:#ffffff;
    font-size:14px;
    text-align:center;
    max-width:640px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
}
@media(max-width:650px){
    .case-container{height:110px;}
    .case-item{
        width:108px;
        height:80px;
        font-size:12px;
    }
    h1 span{
        font-size: clamp(16px,3vw,36px);
    }
    .config-panel{padding:16px;}
    #spinBtn{padding:15px 40px;font-size:18px;}
    .record{padding:20px 16px;}
    .record h3{font-size:20px;}
    .record p{font-size:16px;line-height:2.2;}
    .result{font-size:21px;}
    .flip-grid{
        gap:8px;
    }
    .card-front .card-title{
        font-size:15px;
    }
    .card-front .card-sub{
        font-size:12px;
    }
    .step-hint{
        font-size:15px;
    }
}
</style>
</head>
<body>
<h1>
<span>三</span><span>角</span><span>洲</span><span>行</span><span>动</span><span>全</span><span>能</span><span>抽</span><span>取</span><span>器</span>
</h1>
<div class="config-panel">
    <div class="config-section">
        <div class="config-title">🎰 抽奖模式</div>
        <div class="diff-group">
            <button class="diff-btn mode-switch active" data-mode="scroll">滚动开箱</button>
            <button class="diff-btn mode-switch" data-mode="flip9">翻牌模式</button>
        </div>
    </div>
    <div class="config-section">
        <div class="config-title">📦 抽取内容（勾选参与抽取的项目）</div>
        <div class="check-group">
            <label class="check-item"><input type="checkbox" id="chk-weapon" checked> 武器</label>
            <label class="check-item"><input type="checkbox" id="chk-helmet" checked> 头盔</label>
            <label class="check-item"><input type="checkbox" id="chk-armor" checked> 护甲</label>
            <label class="check-item"><input type="checkbox" id="chk-operator" checked> 干员角色</label>
            <label class="check-item"><input type="checkbox" id="chk-map"> 地图</label>
            <label class="check-item"><input type="checkbox" id="chk-dualGun"> 🗡️双枪模式</label>
            <label class="check-item"><input type="checkbox" id="chk-weapon-extra"> 扩展武器库</label>
        </div>
    </div>
    <div class="config-section">
        <div class="config-title">🔫 武器分类筛选（可多选；双枪模式至少选2类）</div>
        <div class="diff-group">
            <button class="diff-btn weapon-cat-btn" data-weapcat="rifle">步枪</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="smg">冲锋枪</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="shotgun">霰弹枪</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="sniper">狙击</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="lmg">机枪</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="pistol">手枪</button>
            <button class="diff-btn fate" id="weapAllToggle">🎲命运(交给命运)</button>
        </div>
    </div>
    <div class="config-section">
        <div class="config-title">🛡️ 头盔护甲品级</div>
        <div class="diff-group">
            <button class="diff-btn" data-armor="easy">初级(1~3级)</button>
            <button class="diff-btn" data-armor="mid">中级(3~4级)</button>
            <button class="diff-btn" data-armor="hard">高级(3~5级)</button>
            <button class="diff-btn fate active" data-armor="fate">🎲 命运(交给命运)</button>
        </div>
    </div>
    <div class="config-section" id="mapConfigSection" style="display:none;">
        <div class="config-title">🗺️ 地图池（勾选参与抽取的地图）</div>
        <div class="check-group">
            <label class="check-item"><input type="checkbox" class="map-check" value="零号大坝" checked> 零号大坝</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="长弓溪谷" checked> 长弓溪谷</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="巴克什" checked> 巴克什</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="航天基地" checked> 航天基地</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="潮汐监狱" checked> 潮汐监狱</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="AZ3核电站" checked> AZ3核电站</label>
        </div>
        <div class="config-title" style="margin-top:10px; font-size:13px;">地图难度模式</div>
        <div class="diff-group">
            <button class="diff-btn active" data-mapdiff="secret">机密模式</button>
            <button class="diff-btn" data-mapdiff="top">绝密模式</button>
            <button class="diff-btn fate" data-mapdiff="mapfate">🎲命运(交给命运)</button>
        </div>
    </div>
</div>

<div class="case-wrap">
    <div class="case-container">
        <div class="case-track" id="caseTrack"></div>
    </div>
    <div class="case-indicator"></div>
</div>

<div class="flip-wrap" id="flipWrap">
    <div class="flip-grid" id="flipGrid"></div>
</div>

<div class="step-hint" id="stepHint"></div>
<div class="result" id="resText"></div>

<div class="control-box">
    <button class="reset-btn" id="resetBtn">重置重来</button>
    <button id="spinBtn">开始抽取</button>
    <button class="auto-spin-btn" id="autoSpinBtn">自动抽取全部</button>
</div>

<div class="record" id="recordWrap">
    <h3>📋 本局抽取结果</h3>
    <p id="recordText">暂无抽取结果</p>
</div>
<button id="copyImageBtn" disabled>生成结果图片并复制到剪贴板</button>
<div id="copyTip"></div>
<div class="tips"></div>

const ALL_ITEM_WEIGHTS = {};

const operatorList = [];

function parseLevel(name){
    const m = name.match(/\((\d+)级\)/);
    return m ? Number(m[1]) : null;
}
const helmetPool = { easy:[], mid:[], hard:[], fate:[], egg:[] };
const armorPool = { easy:[], mid:[], hard:[], fate:[], egg:[] };

for(const name in ITEM_POOL){
    const meta = ITEM_POOL[name];
    ALL_ITEM_WEIGHTS[name] = meta.weight;
    if(meta.type === "weapon"){
        const isExtra = ["SR-25射手步枪","巴雷特","AWM狙击枪"].includes(name);
        const obj = {name, category: meta.category};
        if(isExtra){
            extraWeaponList.push(obj);
        }else{
            weaponList.push(obj);
        }
    }
    if(meta.type === "operator"){
        operatorList.push({name, sub: meta.sub});
    }
    if(meta.type === "helmet"){
        if(name.includes("不要头")){
            helmetPool.egg.push(name);
        }else{
            const lv = parseLevel(name);
            if(lv!==null){
                if(lv>=1 && lv<=3) helmetPool.easy.push(name);
                if(lv>=3 && lv<=4) helmetPool.mid.push(name);
                if(lv>=3 && lv<=5) helmetPool.hard.push(name);
            }
        }
    }
    if(meta.type === "armor"){
        if(name.includes("不要甲")){
            armorPool.egg.push(name);
        }else{
            const lv = parseLevel(name);
            if(lv!==null){
                if(lv>=1 && lv<=3) armorPool.easy.push(name);
                if(lv>=3 && lv<=4) armorPool.mid.push(name);
                if(lv>=3 && lv<=5) armorPool.hard.push(name);
            }
        }
    }
}

    const allHelmets = new Set([...helmetPool.easy, ...helmetPool.mid, ...helmetPool.hard,...helmetPool.egg]);
    helmetPool.fate = Array.from(allHelmets);
    const allArmors = new Set([...armorPool.easy, ...armorPool.mid, ...armorPool.hard,...armorPool.egg]);

function shuffleArray(arr) {
    const newArr = [...arr];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}

function weightedRandom(pool, lastItemKey){
    const weights = pool.map((item) => {
        let w = ALL_ITEM_WEIGHTS[item.text] ?? 1;
        if(lastResult[lastItemKey] === item.text){
            w *= DRAW_CONFIG.repeatPenalty;
        }
        return w;
    });
    const totalWeight = weights.reduce((sum, w) => sum + w, 0);
    let random = Math.random() * totalWeight;
    for(let i = 0; i < weights.length; i++){
        random -= weights[i];
        if(random <= 0){
            return i;
        }
    }
    return pool.length - 1;
}

function buildQueue(){
    const queue = [];
    const weaponChecked = document.getElementById('chk-weapon').checked;
    const dualGun = document.getElementById('chk-dualGun').checked;
    dualGunExcludeCat = null;
    if(weaponChecked){
        if(dualGun){
            queue.push({key:'weapon1', label:'武器①', isDualFirst:true});
            queue.push({key:'weapon2', label:'武器②', isDualSecond:true});
        }else{
            queue.push({key:'weapon', label:'武器'});
        }
    }
    if(document.getElementById('chk-helmet').checked) queue.push({key:'helmet', label:'头盔'});
    if(document.getElementById('chk-armor').checked) queue.push({key:'armor', label:'护甲'});
    if(document.getElementById('chk-operator').checked) queue.push({key:'operator', label:'干员'});
    if(document.getElementById('chk-map').checked) queue.push({key:'map', label:'地图'});
    return queue;
}

function getCurrentPool(){
    const current = spinQueue[spinIndex];
    if(!current) return [];
    switch(current.key){
        case 'weapon':
        case 'weapon1':
        case 'weapon2': {
            let wList = [...weaponList];
            if(document.getElementById('chk-weapon-extra').checked){
                wList = wList.concat(extraWeaponList);
            }
            wList = wList.filter(w=> selectedWeaponCats.includes(w.category));
            if(current.isDualSecond && dualGunExcludeCat){
                wList = wList.filter(w=> w.category !== dualGunExcludeCat);
            }
            return wList.map(w => ({text: w.name, sub: '', category: w.category}));
        }
        case 'helmet':
            return helmetPool[armorMode].map(name => ({text: name, sub: ''}));
        case 'armor':
            return armorPool[armorMode].map(name => ({text: name, sub: ''}));
        case 'operator':
            return operatorList.map(op => ({text: op.name, sub: op.sub}));
        case 'map':{
            const checkedMapNames = [];
            document.querySelectorAll('.map-check:checked').forEach(cb=>{
                checkedMapNames.push(cb.value);
            });
            const mapPool = [];
            if(mapDiffMode === "mapfate"){
                for(const m of mapSourcePool.secret){
                    if(checkedMapNames.includes(m)) mapPool.push({text: `${m}-机密`, sub:""});
                }
                for(const m of mapSourcePool.top){
                    if(checkedMapNames.includes(m)) mapPool.push({text: `${m}-绝密`, sub:""});
                }
            }else{
                for(const m of mapSourcePool[mapDiffMode]){
                    if(checkedMapNames.includes(m)) mapPool.push({text: m, sub: mapDiffText[mapDiffMode] + '模式'});
                }
            }
            return mapPool;
        }
    }
    return [];
}

function settleResult(current, itemWidthFull, containerWidth){
    const itemsDom = Array.from(caseTrack.querySelectorAll('.case-item'));
    const transformStr = getComputedStyle(caseTrack).transform;
    const matrix = new DOMMatrix(transformStr);
    const realTranslateX = matrix.m41;

    const viewCenterPos = containerWidth / 2;
    const trackLocalX = viewCenterPos - realTranslateX;
    const domIndex = Math.floor(trackLocalX / itemWidthFull);
    const safeIdx = Math.max(0,Math.min(domIndex,itemsDom.length-1));
    const finalWinDom = itemsDom[safeIdx];

    let finalText = "";
    let finalSub = "";
    if(finalWinDom){
        const domText = finalWinDom.innerText.replace(/\n.*/,"").trim();
        finalText = domText;
        const subDom = finalWinDom.querySelector('.sub');
        finalSub = subDom ? subDom.innerText : "";
    }
    const winText = finalText + (finalSub ? `（${finalSub}）` : '');
    resultSet[current.key + '_' + current.label] = winText;
    if(current.isDualFirst){
        const pool = getCurrentPool();
        const foundPoolItem = pool.find(p=>p.text === finalText);
        if(foundPoolItem) dualGunExcludeCat = foundPoolItem.category;
    }
    lastResult[current.key] = finalText;
    spinIndex++;
    updateRecord();
    updateStepHint();
    if(spinIndex < spinQueue.length){
        const next = spinQueue[spinIndex];
        resText.innerText = `✅${current.label}抽到：${winText}`;
        spinBtn.innerText = `抽取${next.label}`;
        isSpinning = false;
        spinBtn.disabled = false;
        autoSpinBtn.disabled = (drawMode === "flip9");
        if(isAutoMode){
            autoSpinBtn.disabled = true;
            spinBtn.disabled = true;
            setTimeout(()=>{
                runSpin();
            },800);
        }
    }else{
        finishAll(winText, current.label);
    }
}

function runSpin(){
    if(isSpinning) return;
    if(spinQueue.length === 0) return;
    if(spinIndex >= spinQueue.length){
        resetAll();
        return;
    }
    const current = spinQueue[spinIndex];
    if(drawMode === "flip9"){
        let pool = getCurrentPool();
        if(!pool || pool.length === 0){
            resText.innerText = "⚠️ 当前选中分类没有可用物品，请重新选择！";
            spinIndex++;
            updateStepHint();
            if(spinIndex >= spinQueue.length){
                finishAll();
            }else{
                isSpinning = false;
                spinBtn.disabled = false;
            }
            return;
        }

        if(flipFlippedIndex !== null){
            resetAll();
            return;
        }

        flipCardPool = [];
        for(let i=0;i<9;i++){
            const rndIdx = weightedRandom(pool, current.key);
            flipCardPool.push(pool[rndIdx]);
        }
        renderFlipCards();
        resText.innerText = `👆请点击一张卡牌，翻开查看【${current.label}】`;
        updateStepHint();
        isSpinning = true;
        spinBtn.disabled = true;
        return;
    }

    let pool = getCurrentPool();
    if(pool.length === 0){
        if(current.isDualSecond){
            resText.innerText = "⚠️双枪模式：剩余可选武器分类为空，请多选几类武器！";
        }else{
            resText.innerText = "⚠️ 当前选中分类没有可用物品，请重新选择武器分类！";
        }
        spinIndex++;
        updateStepHint();
        if(spinIndex >= spinQueue.length){
            finishAll();
        }else{
            runSpin();
        }
        return;
    }
    pool = shuffleArray(pool);
    resText.innerText = `正在抽取${current.label}...`;
    updateStepHint();
    isSpinning = true;
    spinBtn.disabled = true;
    autoSpinBtn.disabled = true;
    buildTrack(pool);
    caseTrack.style.transition = 'none';
    caseTrack.style.transform = 'translateX(0)';
    caseTrack.offsetHeight;
    weightedRandom(pool, current.key);
    const itemEl = caseTrack.querySelector('.case-item');
    const itemWidthFull = itemEl.offsetWidth + 12;
    const containerWidth = caseTrack.parentElement.clientWidth;
    const centerOffset = containerWidth / 2 - itemWidthFull / 2;
    const randomStopOffset = randomRange(DRAW_CONFIG.stopOffsetRange[0], DRAW_CONFIG.stopOffsetRange[1]);
    const copyIndex = REPEAT_COUNT - 3;
    const winIndex = weightedRandom(pool, current.key);
    const globalWinIndex = copyIndex * pool.length + winIndex;
    let targetX = -(globalWinIndex * itemWidthFull - centerOffset) + randomStopOffset;
    caseTrack.style.transition = `transform ${ANIM_DURATION}ms ${EASING}`;
    requestAnimationFrame(()=>{
        caseTrack.style.transform = `translateX(${targetX}px)`;
    });
    setTimeout(()=>{
        let currentX = targetX;
        const doBigJump = Math.random() < DRAW_CONFIG.bigJumpChance;
        const doBounce = !doBigJump && Math.random() < DRAW_CONFIG.bounceChance;
        if(doBigJump || doBounce){
            const px = doBigJump
                ? randomRange(DRAW_CONFIG.bigJumpRange[0], DRAW_CONFIG.bigJumpRange[1])
                : randomRange(DRAW_CONFIG.bounceDistanceRange[0], DRAW_CONFIG.bounceDistanceRange[1]);
            currentX -= px;
            caseTrack.style.transition = `transform ${DRAW_CONFIG.bounceDuration}ms ease-out`;
            caseTrack.style.transform = `translateX(${currentX}px)`;
            setTimeout(()=>{
                settleResult(current, itemWidthFull, containerWidth);
            }, DRAW_CONFIG.bounceDuration);
            return;
        }
        const doSpring = Math.random() < DRAW_CONFIG.springChance;
        if(doSpring){
            const isSpringBig = Math.random() < DRAW_CONFIG.springBigChance;
            const springPx = isSpringBig
                ? randomRange(DRAW_CONFIG.springBigRange[0], DRAW_CONFIG.springBigRange[1])
                : randomRange(DRAW_CONFIG.springSmallRange[0], DRAW_CONFIG.springSmallRange[1]);
            currentX += springPx;
            caseTrack.style.transition = `transform ${DRAW_CONFIG.springDuration}ms ease-out`;
            caseTrack.style.transform = `translateX(${currentX}px)`;
            setTimeout(()=>{
                settleResult(current, itemWidthFull, containerWidth);
            }, DRAW_CONFIG.springDuration);
        }else{
            settleResult(current, itemWidthFull, containerWidth);
        }
    }, ANIM_DURATION);
}

function renderFlipCards(){
    flipGridEl.innerHTML = '';
    flipCardPool.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = "card-item";
        card.dataset.idx = idx;
        card.innerHTML = `
            <div class="card-face card-back">?</div>
            <div class="card-face card-front">
                <div class="card-title">${item.text}</div>
                <div class="card-sub">${item.sub}</div>
            </div>
        `;
        card.onclick = () => handleCardClick(idx);
        flipGridEl.appendChild(card);
    });
}

function handleCardClick(selectedIdx){
    if(flipFlippedIndex !== null) return;
    if(!flipCardPool || flipCardPool.length === 0) return;

    const cards = Array.from(flipGridEl.querySelectorAll('.card-item'));
    const current = spinQueue[spinIndex];
    const winItem = flipCardPool[selectedIdx];
    const winText = winItem.text + (winItem.sub ? `（${winItem.sub}）` : '');

    cards.forEach((card, i) => {
        card.classList.add('disabled');
        if(i === selectedIdx){
            card.classList.add('flipped', 'selected-result');
        }
    });

    resultSet[current.key + '_' + current.label] = winText;
    if(current.isDualFirst){
        dualGunExcludeCat = winItem.category || null;
    }
    lastResult[current.key] = winItem.text;
    flipFlippedIndex = selectedIdx;

    //翻开立刻更新记录，但不做跳转，等待2秒
    updateRecord();
    resText.innerText = `✅${current.label}抽到：${winText}`;

    flipTimer = setTimeout(()=>{
        spinIndex++;
        updateStepHint();
        flipGridEl.innerHTML = '';

        if(spinIndex < spinQueue.length){
            const next = spinQueue[spinIndex];
            resText.innerText = `✅${current.label}抽到：${winText}｜即将抽取【${next.label}】`;
            flipFlippedIndex = null;
            isSpinning = false;
            runSpin();
        }else{
            finishAll(winText, current.label);
        }
    }, FLIP_WAIT_MS);
}

function finishAll(lastItem='', lastLabel=''){
    isSpinning = false;
    isAutoMode = false;
    flipFlippedIndex = null;
    flipGridEl.innerHTML = '';
    flipWrapEl.classList.remove('active');
    stepHintEl.innerText = "🎉所有项目抽取完成！";
    if(lastItem){
        resText.innerText = `🎉全部抽取完成！${lastLabel}：${lastItem}，点击【重置重来】重新开始`;
    }else{
        resText.innerText = `🎉全部抽取完成！点击【重置重来】重新开始`;
    }
    spinBtn.innerText = "重新抽取";
    spinBtn.disabled = false;
    autoSpinBtn.disabled = (drawMode === "flip9");
}

spinBtn.addEventListener('click', runSpin);
autoSpinBtn.addEventListener('click',function(){
    if(isSpinning) return;
    if(drawMode === "flip9") return;
    if(spinIndex >= spinQueue.length){
        resetAll();
    }
    isAutoMode = true;
    runSpin();
});

resetAll();
</script>
